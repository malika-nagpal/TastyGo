<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - TastyGo</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/c24454ae7c.js" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo">
                <a href="index.html"><h1><i class="fas fa-pizza-slice"></i> TastyGo</h1></a>
            </div>
        </div>
    </header>

    <main class="auth-container">
        <div class="auth-card">
            <h2><i class="fas fa-user-plus"></i> Create your TastyGo account</h2>
            <form id="signup-form" class="auth-form">
                <div class="form-group">
                    <label for="name"><i class="fas fa-user"></i> Full Name</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label for="email"><i class="fas fa-envelope"></i> Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="phone"><i class="fas fa-phone"></i> Phone Number</label>
                    <input type="tel" id="phone" required>
                </div>
                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="password" required>
                </div>
                <div class="form-group">
                    <label for="confirm-password"><i class="fas fa-lock"></i> Confirm Password</label>
                    <input type="password" id="confirm-password" required>
                </div>
                <div class="form-options">
                    <div class="terms">
                        <input type="checkbox" id="terms" required>
                        <label for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
                    </div>
                </div>
                <button type="submit" class="auth-btn">Sign up</button>
            </form>
            <div class="auth-footer">
                <p>Already have an account? <a href="login.html">Log in</a></p>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-container">
            <div class="footer-logo">
                <h2><i class="fas fa-pizza-slice"></i> TastyGo</h2>
            </div>
            <div class="footer-links">
                <div class="footer-column">
                    <h3><i class="fas fa-info-circle"></i> Get to Know Us</h3>
                    <a href="#"><i class="fas fa-building"></i> About Us</a>
                    <a href="#"><i class="fas fa-briefcase"></i> Careers</a>
                    <a href="#"><i class="fas fa-chart-line"></i> Investors</a>
                </div>
                <div class="footer-column">
                    <h3><i class="fas fa-hands-helping"></i> Let Us Help You</h3>
                    <a href="#"><i class="fas fa-user-cog"></i> Account Details</a>
                    <a href="#"><i class="fas fa-history"></i> Order History</a>
                    <a href="#"><i class="fas fa-question-circle"></i> Help</a>
                </div>
                <div class="footer-column">
                    <h3><i class="fas fa-handshake"></i> Doing Business</h3>
                    <a href="#"><i class="fas fa-store"></i> Become a Partner</a>
                    <a href="#"><i class="fas fa-ad"></i> Advertise</a>
                </div>
            </div>
        </div>
        <div class="copyright">
            <p>&copy; 2023 TastyGo. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/auth.js"></script>
</body>
</html>
